<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient: deep blue to teal -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <!-- Lens glass gradient -->
    <radialGradient id="glass" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#DCEAF7" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#9DB8D6" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#C7D2DE"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#B6C2CF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Rounded-square app tile (macOS superellipse-ish) -->
  <rect x="92" y="92" width="840" height="840" rx="188" ry="188" fill="url(#bg)"/>

  <!-- Photo stack behind the loupe -->
  <g filter="url(#softShadow)">
    <!-- back photo -->
    <g transform="rotate(-12 470 470)">
      <rect x="300" y="300" width="360" height="300" rx="26" fill="#FFFFFF"/>
      <rect x="300" y="300" width="360" height="300" rx="26" fill="#E8EEF5" opacity="0.0"/>
      <rect x="320" y="470" width="320" height="110" rx="14" fill="#F59E0B" opacity="0.0"/>
    </g>
    <!-- front photo with a little "landscape" -->
    <g transform="rotate(6 470 470)">
      <rect x="300" y="300" width="360" height="300" rx="26" fill="#FFFFFF"/>
      <clipPath id="photoClip">
        <rect x="312" y="312" width="336" height="276" rx="18"/>
      </clipPath>
      <g clip-path="url(#photoClip)">
        <rect x="312" y="312" width="336" height="276" fill="#CDE7FF"/>
        <circle cx="420" cy="392" r="38" fill="#FDE047"/>
        <path d="M312 540 L410 452 L470 512 L540 440 L648 540 L648 588 L312 588 Z" fill="#34D399"/>
      </g>
    </g>
  </g>

  <!-- Loupe (magnifying glass) over the lower-right -->
  <g filter="url(#softShadow)">
    <!-- handle -->
    <rect x="636" y="636" width="196" height="86" rx="43"
          transform="rotate(45 636 636)" fill="url(#handle)"/>
    <!-- outer ring -->
    <circle cx="560" cy="560" r="186" fill="url(#ring)"/>
    <!-- inner bezel -->
    <circle cx="560" cy="560" r="156" fill="#2B4A7E"/>
    <!-- glass -->
    <circle cx="560" cy="560" r="140" fill="url(#glass)"/>
    <!-- glass highlight -->
    <path d="M470 492 a140 140 0 0 1 150 -36 a96 96 0 0 0 -150 36 Z" fill="#FFFFFF" opacity="0.55"/>
  </g>
</svg>
